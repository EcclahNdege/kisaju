<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kisaju Poultry System{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
{% if user.is_authenticated %}
<nav class="navbar navbar-dark bg-success mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'dashboard' %}">Kisaju Poultry System</a>
    <a class="nav-link text-white me-auto" href="{% url 'log_list' %}">Daily logs</a>    <div class="d-flex align-items-center text-white">
      <span class="me-3">{{ user.username }} · {{ user.get_role_display }}</span>
      <form method="post" action="{% url 'logout' %}" class="m-0">
        {% csrf_token %}
        <button class="btn btn-sm btn-outline-light">Log out</button>
      </form>
    </div>
  </div>
</nav>
{% endif %}
<main class="container">
    {% for m in messages %}
    <div class="alert alert-success">{{ m }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
